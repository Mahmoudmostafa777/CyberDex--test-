name: unzip-site
on:
  push:
    paths: ['CyberDex-fixed.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -oq CyberDex-fixed.zip
          rm CyberDex-fixed.zip
      - run: |
          git config user.name "cyberdex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update site" || exit 0
          git push
